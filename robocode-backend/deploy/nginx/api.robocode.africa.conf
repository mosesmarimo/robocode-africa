# nginx reverse proxy for the RoboCode API.
# Install: sudo cp deploy/nginx/api.robocode.africa.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/api.robocode.africa.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d api.robocode.africa   # provisions Let's Encrypt TLS
server {
    listen 80;
    listen [::]:80;
    server_name api.robocode.africa;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;          # tenant resolution depends on this
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }
}
# After `certbot --nginx` this block is upgraded to listen 443 ssl with the
# Let's Encrypt certificate, and port 80 is redirected to 443 automatically.
