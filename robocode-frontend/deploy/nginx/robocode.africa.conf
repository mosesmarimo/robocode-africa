# nginx reverse proxy for the RoboCode web app, including white-label tenant
# subdomains (*.robocode.africa). Install:
#   sudo cp deploy/nginx/robocode.africa.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/robocode.africa.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS:
#   apex + www (HTTP-01):   sudo certbot --nginx -d robocode.africa -d www.robocode.africa
#   wildcard subdomains require DNS-01 (see deploy/DEPLOY.md):
#       sudo certbot certonly --manual --preferred-challenges dns -d '*.robocode.africa'
server {
    listen 80;
    listen [::]:80;
    # Apex + www. White-label tenant subdomains (*.robocode.africa) need a
    # wildcard cert via DNS-01 in their own server block — don't add the wildcard
    # here or it shadows api.robocode.africa on :443.
    server_name robocode.africa www.robocode.africa;

    # Studio "Validate with AI" posts a base64 PNG of the diagram through a server
    # action — raise from nginx's 1MB default so those uploads don't 413.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;          # tenant resolution depends on this
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 200s;
    }
}
