# nginx routing for published-project subdomains:
#   *.robocode.studio  — dedicated bare-project hosting domain (any subdomain
#                        always serves a published project, chromeless _site route)
#   *.robocode.africa  — school-tenant subdomains, with a published-project
#                        fallback when no tenant matches (tenants always win)
#
# The Next.js frontend (port 3100) does all Host-based routing — nginx only
# forwards the Host header, same as robocode.africa.conf.
#
# TLS:
#   /etc/letsencrypt/live/robocode.studio        — *.robocode.studio + robocode.studio (DNS-01)
#   /etc/letsencrypt/live/robocode.africa-wildcard — *.robocode.africa (DNS-01; block below
#   stays commented until this cert is issued)
#   NOTE: DNS-01 certs here were issued with a manual TXT round-trip (see
#   deploy/DEPLOY.md) — they do NOT auto-renew. Renew quarterly the same way,
#   or provision a GoDaddy API key and switch to a DNS-plugin ACME client.

# --- HTTPS: published sites + bare robocode.studio --------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.robocode.studio robocode.studio;

    ssl_certificate /etc/letsencrypt/live/robocode.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robocode.studio/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;          # publish/tenant resolution depends on this
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 200s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.robocode.africa;

    ssl_certificate /etc/letsencrypt/live/robocode.africa-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robocode.africa-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 200s;
    }
}

# --- HTTP: everything redirects to https (both wildcard certs are live) ----
server {
    listen 80;
    listen [::]:80;
    server_name *.robocode.studio robocode.studio *.robocode.africa;
    return 301 https://$host$request_uri;
}
